## ---- FILE 3: cfg/vera_gate_config.yaml ----
## Quality gate configuration
#
# max_failures: 0
# max_warnings: 20
# min_pass_rate_pct: 95.0
#
# # These checkers MUST run (or gate fails)
# required_checkers:
#   - vera_adc_enob
#   - vera_adc_dnl
#   - vera_adc_inl
#   - vera_pll_lock_time
#   - vera_pll_jitter_rms
#
# # These checkers MUST NOT fail (zero tolerance)
# blocked_checkers:
#   - vera_sram_read_data
#   - vera_uart_protocol_tx_stop_bit
#   - vera_axi4_aw_valid_stable
#
# severity_block:
#   ERROR: true
#   WARNING: false

