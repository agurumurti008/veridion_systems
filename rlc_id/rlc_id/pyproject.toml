[project]
name = "rlc-id"
version = "0.1.0"
description = "RLC network system-identification framework: Prony, ERA, Vector Fitting, subspace, S-parameter, and Laplace verification as interchangeable strategies"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[project.scripts]
rlc-id = "rlc_id.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
